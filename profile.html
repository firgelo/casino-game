<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MEGA CASINO — Профиль</title>


    <script src="https://telegram.org"></script>

    <script>

        if (window.Telegram?.WebApp) {

            Telegram.WebApp.ready();

            Telegram.WebApp.expand();

        }

    </script>


    <style>

        :root {

            --bg: #070b14;

            --bg2: #11182a;

            --text: #f7f8ff;

            --muted: #8994ad;

            --gold: #ffd15b;

            --green: #36e49a;

            --red: #ff5876;

            --blue: #4ca9ff;

            --purple: #9575ff;

            --line: rgba(255,255,255,.08);

            --nav: 72px;

        }


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        body {

            margin: 0;

            min-height: 100vh;

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 50% -10%,
                    rgba(149,117,255,.28),
                    transparent 38%
                ),

                radial-gradient(
                    circle at 0% 50%,
                    rgba(76,169,255,.08),
                    transparent 30%
                ),

                linear-gradient(
                    160deg,
                    var(--bg2),
                    var(--bg)
                );

            overflow-x: hidden;

            -webkit-user-select: none;

            user-select: none;

        }


        .app {

            width: min(100%,460px);

            min-height: 100vh;

            margin: auto;

            padding:
                max(16px,env(safe-area-inset-top))
                14px
                calc(var(--nav) + 25px);

        }


        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 14px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .brand-icon {

            width: 42px;
            height: 42px;

            display: grid;

            place-items: center;

            border-radius: 14px;

            background:

                linear-gradient(
                    145deg,
                    rgba(149,117,255,.24),
                    rgba(76,169,255,.08)
                );

            border:
                1px solid rgba(149,117,255,.22);

            font-size: 22px;

        }


        .brand-title {

            font-size: 15px;

            font-weight: 900;

        }


        .brand-subtitle {

            margin-top: 2px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

        }


        .card {

            padding: 20px;

            border-radius: 28px;

            background:

                linear-gradient(
                    180deg,
                    rgba(25,35,59,.89),
                    rgba(9,15,27,.94)
                );

            border:
                1px solid var(--line);

            box-shadow:

                0 25px 80px rgba(0,0,0,.37),

                inset
                0 1px 0
                rgba(255,255,255,.05);

        }


        .profile-head {

            text-align: center;

            margin-bottom: 23px;

        }


        .avatar {

            width: 92px;

            height: 92px;

            margin: auto auto 12px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 35% 28%,
                    #cabdff,
                    #8064eb 50%,
                    #4433a0
                );

            border:
                4px solid
                rgba(255,255,255,.18);

            box-shadow:

                0 0 35px
                rgba(149,117,255,.25);

            font-size: 45px;

        }


        #username-display {

            font-size: 21px;

            font-weight: 950;

        }


        .username-label {

            margin-top: 4px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

        }


        .edit-name-btn {

            margin-top: 9px;

            padding: 7px 12px;

            border: none;

            border-radius: 999px;

            background:
                rgba(76,169,255,.1);

            border:
                1px solid
                rgba(76,169,255,.16);

            color: #72bfff;

            font-size: 10px;

            font-weight: 900;

            cursor: pointer;

        }


        .stats-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 9px;

            margin-bottom: 20px;

        }


        .stat-box {

            padding: 13px;

            border-radius: 16px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.055);

        }


        .stat-title {

            color: var(--muted);

            font-size: 8px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .4px;

        }


        .stat-value {

            margin-top: 6px;

            font-size: 15px;

            font-weight: 950;

        }


        .promo {

            margin-top: 5px;

            padding: 15px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,81,112,.08),
                    rgba(149,117,255,.05)
                );

            border:
                1px solid
                rgba(255,255,255,.06);

        }


        .promo-title {

            font-size: 13px;

            font-weight: 900;

            margin-bottom: 4px;

        }


        .promo-subtitle {

            color: var(--muted);

            font-size: 9px;

            font-weight: 700;

            margin-bottom: 11px;

        }


        .promo-input-group {

            display: flex;

            gap: 8px;

        }


        .promo-input {

            flex: 1;

            min-width: 0;

            height: 46px;

            padding: 0 13px;

            border-radius: 13px;

            outline: none;

            background:
                rgba(4,8,15,.55);

            border:
                1px solid
                rgba(255,255,255,.08);

            color: white;

            font-size: 12px;

            font-weight: 700;

        }


        .promo-input::placeholder {

            color: #68738c;

        }


        .promo-btn {

            height: 46px;

            padding: 0 17px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ff617c,
                    #dd3657
                );

            color: white;

            font-size: 11px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(221,54,87,.2);

        }


        .message {

            min-height: 18px;

            margin-top: 10px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

            text-align: center;

        }


        .bottom-nav {

            position: fixed;

            z-index: 1000;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width:
                min(100%,460px);

            height:
                var(--nav);

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            padding:
                6px 7px;

            background:
                rgba(8,12,22,.86);

            border-top:
                1px solid
                rgba(255,255,255,.07);

            backdrop-filter: blur(20px);

        }


        .nav-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #74809a;

            text-decoration: none;

            border-radius: 14px;

        }


        .nav-item.active {

            color: #9e82ff;

            background:
                linear-gradient(
                    180deg,
                    rgba(149,117,255,.13),
                    rgba(149,117,255,.035)
                );

        }


        .nav-icon {

            font-size: 20px;

        }


        .nav-text {

            font-size: 8px;

            font-weight: 900;

        }


    </style>

</head>


<body>


<div class="app">


    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                👤
            </div>

            <div>

                <div class="brand-title">
                    MEGA CASINO
                </div>

                <div class="brand-subtitle">
                    Player Profile
                </div>

            </div>

        </div>

    </header>


    <main class="card">


        <section class="profile-head">


            <div class="avatar">
                👤
            </div>


            <div id="username-display">
                Игрок
            </div>


            <div class="username-label">
                Игрок Mega Casino
            </div>


            <button
                class="edit-name-btn"
                id="edit-name-btn"
            >
                ✏️ Изменить ник
            </button>


        </section>


        <section class="stats-grid">


            <div class="stat-box">

                <div class="stat-title">
                    Монеты
                </div>

                <div
                    class="stat-value"
                    id="prof-coins"
                    style="color:#ffd15b"
                >
                    0 💰
                </div>

            </div>


            <div class="stat-box">

                <div class="stat-title">
                    Биткоины
                </div>

                <div
                    class="stat-value"
                    id="prof-btc"
                    style="color:#36e49a"
                >
                    0.0000 ₿
                </div>

            </div>


            <div class="stat-box">

                <div class="stat-title">
                    Джекпоты
                </div>

                <div
                    class="stat-value"
                    id="prof-jack"
                    style="color:#ffe067"
                >
                    0 👑
                </div>

            </div>


            <div class="stat-box">

                <div class="stat-title">
                    Сила клика
                </div>

                <div
                    class="stat-value"
                    id="prof-power"
                    style="color:#ff9b55"
                >
                    Лвл. 1 💪
                </div>

            </div>


        </section>


        <section class="promo">


            <div class="promo-title">
                🎁 Промокод
            </div>


            <div class="promo-subtitle">
                Введи специальный код и получи бонус
            </div>


            <div class="promo-input-group">

                <input
                    id="promo-input"
                    class="promo-input"
                    type="text"
                    placeholder="Введите код..."
                    autocomplete="off"
                >


                <button
                    class="promo-btn"
                    id="promo-btn"
                >
                    АКТИВИРОВАТЬ
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>


        </section>


    </main>


</div>


<nav class="bottom-nav">


    <a
        href="game.html?v=2"
        class="nav-item"
    >

        <span class="nav-icon">
            🎡
        </span>

        <span class="nav-text">
            Колесо
        </span>

    </a>


    <a
        href="dice.html?v=2"
        class="nav-item"
    >

        <span class="nav-icon">
            🎲
        </span>

        <span class="nav-text">
            Кубики
        </span>

    </a>


    <a
        href="clicker.html?v=2"
        class="nav-item"
    >

        <span class="nav-icon">
            ⚡
        </span>

        <span class="nav-text">
            Биткоин
        </span>

    </a>


    <a
        href="profile.html?v=2"
        class="nav-item active"
    >

        <span class="nav-icon">
            👤
        </span>

        <span class="nav-text">
            Профиль
        </span>

    </a>


</nav>


<script>

    let coins =
        parseInt(
            localStorage.getItem(
                "casino_coins"
            ),
            10
        ) || 100;


    let bitcoin =
        parseFloat(
            localStorage.getItem(
                "crypto_btc"
            )
        ) || 0;


    let jackpots =
        parseInt(
            localStorage.getItem(
                "casino_jackpots"
            ),
            10
        ) || 0;


    let clickPower =
        parseInt(
            localStorage.getItem(
                "click_power"
            ),
            10
        ) || 1;


    let username =
        localStorage.getItem(
            "casino_username"
        ) || "Игрок";


    const usernameDisplay =
        document.getElementById(
            "username-display"
        );


    const profCoins =
        document.getElementById(
            "prof-coins"
        );


    const profBtc =
        document.getElementById(
            "prof-btc"
        );


    const profJack =
        document.getElementById(
            "prof-jack"
        );


    const profPower =
        document.getElementById(
            "prof-power"
        );


    const editNameBtn =
        document.getElementById(
            "edit-name-btn"
        );


    const promoInput =
        document.getElementById(
            "promo-input"
        );


    const promoBtn =
        document.getElementById(
            "promo-btn"
        );


    const message =
        document.getElementById(
            "message"
        );


    function updateUI() {

        usernameDisplay.textContent =
            username;


        profCoins.textContent =
            `${Math.floor(coins).toLocaleString("ru-RU")} 💰`;


        profBtc.textContent =
            `${bitcoin.toFixed(4)} ₿`;


        profJack.textContent =
            `${jackpots} 👑`;


        profPower.textContent =
            `Лвл. ${clickPower} 💪`;

    }


    updateUI();


    editNameBtn.addEventListener(
        "click",
        () => {

            const newName =
                prompt(
                    "Введите новый никнейм:",
                    username
                );


            if (
                newName &&
                newName.trim()
            ) {

                username =
                    newName
                        .trim()
                        .substring(0,12);


                localStorage.setItem(
                    "casino_username",
                    username
                );


                updateUI();

            }

        }
    );


    promoBtn.addEventListener(
        "click",
        () => {

            const code =
                promoInput.value
                    .trim()
                    .toUpperCase();


            if (code === "BONUS") {

                coins += 500;


                localStorage.setItem(
                    "casino_coins",
                    coins
                );


                updateUI();


                message.textContent =
                    "🎉 Промокод активирован! +500 монет";


                message.style.color =
                    "#36e49a";


                promoInput.value = "";

            }

            else {

                message.textContent =
                    "❌ Неверный промокод";


                message.style.color =
                    "#ff6b82";

            }


            setTimeout(
                () => {

                    message.textContent =
                        "";

                },
                3000
            );

        }
    );

</script>


</body>
</html>
