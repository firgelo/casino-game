<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Кубики против Бота</title>
    
    <!-- ПОДКЛЮЧЕНИЕ TELEGRAM WEB APP -->
    <script src="https://telegram.org"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .main-wrapper {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 10px 15px 100px 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .header-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin: 15px auto 15px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .header-btn {
            background-color: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            height: 42px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
        }
        
        /* Стили для 3D Кубиков */
        .dice-container {
            background-color: #222;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-top: 10px;
        }
        .dice-container h3 { margin-top: 0; color: #3742fa; }
        .game-container-vertical {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .dice-name { font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        
        /* 3D Сцена для кубиков */
        .scene { width: 60px; height: 60px; perspective: 300px; margin: 0 auto; }
        .cube {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 1.5s ease-out; font-size: 40px; line-height: 60px;
        }
        .cube-face {
            position: absolute; width: 60px; height: 60px; background: #fff;
            color: #000; border: 2px solid #ccc; border-radius: 10px; text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1); backface-visibility: hidden;
        }
        .front  { transform: rotateY(  0deg) translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY( 90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX( 90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        .turbo-wrapper { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 15px 0; font-size: 13px; }
        #buy-auto-farm-btn { background-color: #3742fa; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        #кнопка { background-color: #34495e; color: white; border: 2px solid #3742fa; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }

        #c { font-size: 14px; color: #1dd1a1; margin: 15px 0 5px 0; font-weight: bold; }
        #jackpot-counter { font-size: 13px; color: #f1c40f; margin: 5px 0; }
        #coins-counter { font-size: 15px; color: #ffa502; font-weight: bold; margin: 5px 0; }
        .modal-overlay { display: none; }

        /* ТАБ-БАР (НИЖНЕЕ МЕНЮ) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background-color: #1e1e24; border-top: 2px solid #2c3e50;
            display: flex; justify-content: space-around; align-items: center; z-index: 99999;
        }
        .nav-item { text-decoration: none; color: #8892b0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33.33%; height: 100%; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        .nav-text { font-size: 11px; font-weight: bold; }
        .nav-item.active { color: #f39c12; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }
    </style>
</head>
<body>

    <div class="header-menu">
        <button id="promo-open-btn" class="header-btn">Промокод 🎁</button>
        <button id="shop-open-btn" class="header-btn">Магазин 🛒</button>
        <button id="inv-open-btn" class="header-btn">Инвентарь 🎒</button>
        <button id="auth-header-btn" class="header-btn">firgelo 👤</button>
    </div>

    <div class="main-wrapper">
        <div class="dice-container">
            <h3>🎲 3D Кубики против Бота:</h3>
            <div class="game-container-vertical">
                <div class="dice-player-wrapper">
                    <div class="dice-name player">Ты: —</div>
                    <div class="scene">
                        <div id="player-dice-3d" class="cube">
                            <div class="cube-face front">⚀</div>
                            <div class="cube-face back">⚅</div>
                            <div class="cube-face right">⚃</div>
                            <div class="cube-face left">⚂</div>
                            <div class="cube-face top">⚁</div>
                            <div class="cube-face bottom">⚄</div>
                        </div>
                    </div>
                </div>
                <div class="dice-bot-wrapper">
                    <div class="dice-name bot">Бот: —</div>
                    <div class="scene">
                        <div id="bot-dice-3d" class="cube">
                            <div class="cube-face front">⚀</div>
                            <div class="cube-face back">⚅</div>
                            <div class="cube-face right">⚃</div>
                            <div class="cube-face left">⚂</div>
                            <div class="cube-face top">⚁</div>
                            <div class="cube-face bottom">⚄</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="turbo-wrapper" id="turbo-toggle">
                <div class="turbo-checkbox"></div>
                <span class="turbo-text">Быстрый прокрут</span>
            </div>
            <button id="slots-open-btn" class="header-btn" style="width: 100%; margin-bottom: 8px; border-radius: 8px;">Все автоматы 🎰</button>
            <button id="buy-auto-farm-btn">Купить Автомат (150 ₿)</button>
            <button id="кнопка">Бросить кубики 🎲</button>
        </div>
        <p id="c">Нажми на кнопку, чтобы начать игру!</p>
        <p id="jackpot-counter">👑 Джекпотов: 0</p>
        <p id="coins-counter">💰 Монеты: --</p>
    </div>

    <div class="bottom-nav">
        <a href="wheel.html" class="nav-item"><span class="nav-icon">🎡</span><span class="nav-text">Колесо</span></a>
        <a href="dice.html" class="nav-item active"><span class="nav-icon">🎲</span><span class="nav-text">Кубики</span></a>
        <a href="clicker.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-text">Биткоин</span></a>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
