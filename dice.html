<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Кубики против Бота</title>
    
    <!-- ПОДКЛЮЧЕНИЕ TELEGRAM WEB APP -->
    <script src="https://telegram.org"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>

    <!-- ВСТРОЕННЫЕ МОБИЛЬНЫЕ СТИЛИ С БЛОКИРОВКОЙ СИНЕВЫ -->
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            /* ПОЛНОСТЬЮ УБИРАЕМ СИНЮЮ ПОДСВЕТКУ И ВЫДЕЛЕНИЕ ТЕКСТА НА ВСЕЙ СТРАНИЦЕ */
            -webkit-tap-highlight-color: transparent !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }
        .main-wrapper { 
            width: 100%; 
            max-width: 360px; 
            margin: 0 auto; 
            padding: 30px 15px 100px 15px; 
            box-sizing: border-box; 
            text-align: center; 
        }
        .dice-container { 
            background-color: #222; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            margin-top: 10px; 
        }
        .dice-container h3 { margin-top: 0; color: #3742fa; }
        .game-container-vertical { display: flex; justify-content: space-around; margin: 20px 0; }
        .dice-name { font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        
        .scene { width: 60px; height: 60px; perspective: 300px; margin: 0 auto; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.5s ease-out; font-size: 40px; line-height: 60px; }
        .cube-face { position: absolute; width: 60px; height: 60px; background: #fff; color: #000; border: 2px solid #ccc; border-radius: 10px; text-align: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); backface-visibility: hidden; }
        .front  { transform: rotateY(  0deg) translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY( 90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX( 90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }
        
        #кнопка { 
            background-color: #34495e; 
            color: white; 
            border: 2px solid #3742fa; 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent !important;
        }
        #кнопка:active { background-color: #2c3e50; }
        
        #c { font-size: 14px; color: #1dd1a1; margin: 15px 0 5px 0; font-weight: bold; min-height: 20px; }
        #jackpot-counter { font-size: 13px; color: #f1c40f; margin: 5px 0; }
        #coins-counter { font-size: 15px; color: #ffa502; font-weight: bold; margin: 5px 0; }
        
        /* ЧЕТЫРЕХКНОПОЧНЫЙ ТАБ-БАР */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background-color: #1e1e24; 
            border-top: 2px solid #2c3e50; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 99999; 
        }
        .nav-item { 
            text-decoration: none; 
            color: #8892b0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 25%; 
            height: 100%; 
            -webkit-tap-highlight-color: transparent !important;
        }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        .nav-text { font-size: 10px; font-weight: bold; }
        .nav-item.active { color: #f39c12; text-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="dice-container">
            <h3>🎲 3D Кубики против Бота:</h3>
            <div class="game-container-vertical">
                <div class="dice-player-wrapper">
                    <div class="dice-name player">Ты: —</div>
                    <div class="scene">
                        <div id="player-dice-3d" class="cube">
                            <div class="cube-face front">⚀</div>
                            <div class="cube-face back">⚅</div>
                            <div class="cube-face right">⚃</div>
                            <div class="cube-face left">⚂</div>
                            <div class="cube-face top">⚁</div>
                            <div class="cube-face bottom">⚄</div>
                        </div>
                    </div>
                </div>
                <div class="dice-bot-wrapper">
                    <div class="dice-name bot">Бот: —</div>
                    <div class="scene">
                        <div id="bot-dice-3d" class="cube">
                            <div class="cube-face front">⚀</div>
                            <div class="cube-face back">⚅</div>
                            <div class="cube-face right">⚃</div>
                            <div class="cube-face left">⚂</div>
                            <div class="cube-face top">⚁</div>
                            <div class="cube-face bottom">⚄</div>
                        </div>
                    </div>
                </div>
            </div>
            <button id="кнопка">Бросить кубики 🎲</button>
        </div>
        <p id="c">Нажми на кнопку, чтобы начать игру!</p>
        <p id="jackpot-counter">👑 Джекпотов: 0</p>
        <p id="coins-counter">💰 Монеты: --</p>
    </div>

    <!-- ЧЕТЫРЕ КНОПКИ В МЕНЮ -->
    <div class="bottom-nav">
        <a href="game.html" class="nav-item"><span class="nav-icon">🎡</span><span class="nav-text">Колесо</span></a>
        <a href="dice.html" class="nav-item active"><span class="nav-icon">🎲</span><span class="nav-text">Кубики</span></a>
        <a href="clicker.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-text">Биткоин</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-text">Профиль</span></a>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('casino_coins')) || 100;
        let jackpots = parseInt(localStorage.getItem('casino_jackpots')) || 0;
        const coinsCounter = document.getElementById('coins-counter');
        const jackpotCounter = document.getElementById('jackpot-counter');
        const resultText = document.getElementById('c');
        const diceBtn = document.getElementById('кнопка');
        
        function updateUI() { coinsCounter.innerText = `💰 Монеты: ${coins}`; jackpotCounter.innerText = `👑 Джекпотов: ${jackpots}`; }
        updateUI();
        
        let isRolling = false;
        const playerCube = document.getElementById('player-dice-3d');
        const botCube = document.getElementById('bot-dice-3d');
        const faces = [{x: 0, y: 0}, {x: -90, y: 0}, {x: 0, y: 90}, {x: 0, y: -90}, {x: 90, y: 0}, {x: 180, y: 0}];
        
        diceBtn.addEventListener('click', () => {
            if (isRolling) return;
            if (coins < 10) { resultText.innerText = "❌ Нужно минимум 10 монет!"; return; }
            coins -= 10; isRolling = true; resultText.innerText = "🎲 Кубики брошены..."; updateUI();
            const pResult = Math.floor(Math.random() * 6) + 1;
            const bResult = Math.floor(Math.random() * 6) + 1;
            playerCube.style.transform = `rotateX(${faces[pResult-1].x + 720}deg) rotateY(${faces[pResult-1].y + 720}deg)`;
            botCube.style.transform = `rotateX(${faces[bResult-1].x + 720}deg) rotateY(${faces[bResult-1].y + 720}deg)`;
            setTimeout(() => {
                isRolling = false;
                playerCube.style.transform = `rotateX(${faces[pResult-1].x}deg) rotateY(${faces[pResult-1].y}deg)`;
                botCube.style.transform = `rotateX(${faces[bResult-1].x}deg) rotateY(${faces[bResult-1].y}deg)`;
                document.querySelector('.dice-name.player').innerText = `Ты: ${pResult}`;
                document.querySelector('.dice-name.bot').innerText = `Бот: ${bResult}`;
                if (pResult > bResult) { coins += 25; resultText.innerText = `🎉 Вы выиграли! (+25 💰)`; }
                else if (pResult < bResult) { resultText.innerText = `💀 Бот победил!`; }
                else { coins += 10; resultText.innerText = `👔 Ничья!`; }
                localStorage.setItem('casino_coins', coins); updateUI();
            }, 1500);
        });
    </script>
</body>
</html>
