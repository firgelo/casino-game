<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MEGA CASINO — Bitcoin</title>

    <script src="https://telegram.org"></script>
    <script>
        if (window.Telegram?.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    </script>


    <style>

        :root {

            --bg: #070b14;
            --bg2: #11182a;

            --text: #f7f8ff;
            --muted: #8994ad;

            --orange: #ffae32;
            --orange2: #ff702e;

            --green: #36e49a;

            --line: rgba(255,255,255,.08);

            --nav: 72px;

        }


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        body {

            margin: 0;

            min-height: 100vh;

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,157,48,.20),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 0% 60%,
                    rgba(255,100,52,.09),
                    transparent 30%
                ),

                linear-gradient(
                    160deg,
                    var(--bg2),
                    var(--bg)
                );

            overflow-x: hidden;

            -webkit-user-select: none;
            user-select: none;

        }


        .app {

            width: min(100%,460px);

            min-height: 100vh;

            margin: auto;

            padding:
                max(16px,env(safe-area-inset-top))
                14px
                calc(var(--nav) + 25px);

        }


        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 14px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .brand-icon {

            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,174,50,.25),
                    rgba(255,105,40,.07)
                );

            border: 1px solid rgba(255,174,50,.22);

            font-size: 22px;

        }


        .brand-title {

            font-size: 15px;

            font-weight: 900;

        }


        .brand-subtitle {

            margin-top: 2px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

            text-transform: uppercase;

        }


        .balance {

            padding: 8px 10px;

            border-radius: 14px;

            background: rgba(255,255,255,.045);

            border: 1px solid rgba(255,255,255,.07);

            text-align: center;

        }


        .balance-title {

            display: block;

            color: var(--muted);

            font-size: 8px;

            font-weight: 800;

        }


        .balance-value {

            color: var(--orange);

            font-size: 12px;

            font-weight: 900;

        }


        .game-card {

            position: relative;

            padding: 18px;

            border-radius: 28px;

            background:
                linear-gradient(
                    180deg,
                    rgba(25,35,59,.89),
                    rgba(9,15,27,.94)
                );

            border: 1px solid var(--line);

            box-shadow:
                0 25px 80px rgba(0,0,0,.38),
                inset 0 1px 0 rgba(255,255,255,.05);

        }


        .heading {

            text-align: center;

            margin-bottom: 15px;

        }


        .title {

            font-size: 20px;

            font-weight: 900;

        }


        .subtitle {

            margin-top: 5px;

            color: var(--muted);

            font-size: 10px;

            font-weight: 700;

        }


        .stats {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-bottom: 20px;

        }


        .stat {

            padding: 11px;

            border-radius: 15px;

            background: rgba(255,255,255,.035);

            border: 1px solid rgba(255,255,255,.06);

        }


        .stat-label {

            color: var(--muted);

            font-size: 8px;

            font-weight: 800;

            text-transform: uppercase;

        }


        .stat-value {

            margin-top: 4px;

            font-size: 14px;

            font-weight: 900;

        }


        #click-zone {

            position: relative;

            display: grid;

            place-items: center;

            padding: 10px 0 20px;

        }


        #clicker-coin {

            width: min(58vw,190px);

            aspect-ratio: 1;

            display: grid;

            place-items: center;

            border-radius: 50%;

            cursor: pointer;

            font-size: clamp(65px,18vw,95px);

            font-weight: 900;

            color: #fff8d7;

            background:

                radial-gradient(
                    circle at 35% 28%,
                    #ffeaa3,
                    #ffb32e 42%,
                    #f36a27 75%,
                    #bb421f
                );

            border: 8px solid rgba(255,235,167,.8);

            box-shadow:

                0 0 0 8px rgba(255,174,50,.06),

                0 0 45px rgba(255,153,43,.35),

                0 20px 40px rgba(0,0,0,.35),

                inset 0 4px 10px rgba(255,255,255,.28),

                inset 0 -10px 20px rgba(117,32,0,.2);

            transition:
                transform .08s ease,
                filter .15s ease;

        }


        #clicker-coin:hover {

            filter: brightness(1.05);

        }


        #clicker-coin:active {

            transform: scale(.92) rotate(-2deg);

        }


        .coin-ring {

            position: absolute;

            width: calc(min(58vw,190px) + 28px);

            aspect-ratio: 1;

            border-radius: 50%;

            border: 1px solid rgba(255,196,78,.16);

            box-shadow:
                0 0 35px rgba(255,174,47,.12);

            pointer-events: none;

            animation: ringPulse 2.3s ease-in-out infinite;

        }


        @keyframes ringPulse {

            0%,100% {
                transform: scale(1);
                opacity: .65;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }

        }


        .click-hint {

            margin-top: 5px;

            color: var(--muted);

            font-size: 9px;

            font-weight: 800;

        }


        .actions {

            display: grid;

            gap: 8px;

            margin-top: 5px;

        }


        .action-btn {

            width: 100%;

            min-height: 54px;

            padding: 11px 14px;

            border: none;

            border-radius: 16px;

            color: white;

            font-size: 13px;

            font-weight: 900;

            cursor: pointer;

            text-align: left;

            transition:
                transform .12s ease,
                filter .18s ease;

        }


        .action-btn:active {

            transform: scale(.985);

        }


        .action-btn.primary {

            background:
                linear-gradient(
                    135deg,
                    #ffbd3f,
                    #ff8c32
                );

            box-shadow:
                0 10px 25px rgba(255,150,40,.18);

        }


        .action-btn.secondary {

            background:
                linear-gradient(
                    135deg,
                    #39cfa0,
                    #2687c6
                );

            box-shadow:
                0 10px 25px rgba(45,190,164,.16);

        }


        .floating-number {

            position: absolute;

            color: #ffe078;

            font-size: 24px;

            font-weight: 950;

            text-shadow:
                0 0 10px rgba(255,178,45,.65);

            pointer-events: none;

            animation:
                floatCoins
                .65s
                cubic-bezier(.25,1,.5,1)
                forwards;

            z-index: 100;

        }


        @keyframes floatCoins {

            0% {

                transform:
                    translate(-50%,-50%)
                    scale(.6);

                opacity: 1;

            }

            100% {

                transform:
                    translate(-50%,-125px)
                    scale(1.1);

                opacity: 0;

            }

        }


        .toast {

            position: fixed;

            left: 50%;
            bottom: 90px;

            transform:
                translate(-50%,20px);

            z-index: 9999;

            min-width: 190px;

            padding: 10px 14px;

            border-radius: 14px;

            background: rgba(12,18,32,.92);

            border: 1px solid rgba(255,255,255,.1);

            backdrop-filter: blur(15px);

            color: white;

            font-size: 11px;

            font-weight: 800;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transition: .25s ease;

        }


        .toast.show {

            opacity: 1;

            transform:
                translate(-50%,0);

        }


        .bottom-nav {

            position: fixed;

            z-index: 1000;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: min(100%,460px);

            height: var(--nav);

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            padding: 6px 7px;

            background:
                rgba(8,12,22,.86);

            border-top:
                1px solid rgba(255,255,255,.07);

            backdrop-filter: blur(20px);

        }


        .nav-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #74809a;

            text-decoration: none;

            border-radius: 14px;

        }


        .nav-item.active {

            color: var(--orange);

            background:
                linear-gradient(
                    180deg,
                    rgba(255,174,50,.13),
                    rgba(255,174,50,.035)
                );

        }


        .nav-icon {

            font-size: 20px;

        }


        .nav-text {

            font-size: 8px;

            font-weight: 900;

        }

    </style>
</head>


<body>

<div class="app">

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                ₿
            </div>

            <div>

                <div class="brand-title">
                    MEGA CASINO
                </div>

                <div class="brand-subtitle">
                    Bitcoin Miner
                </div>

            </div>

        </div>


        <div class="balance">

            <span class="balance-title">
                Монеты
            </span>

            <span
                class="balance-value"
                id="coins-counter"
            >
                0 💰
            </span>

        </div>

    </header>


    <main
        class="game-card"
        id="click-zone"
    >

        <div class="heading">

            <div class="title">
                ⚡ Биткоин Кликер
            </div>

            <div class="subtitle">
                Кликай, прокачивай ферму и получай BTC
            </div>

        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    BTC
                </div>

                <div
                    class="stat-value"
                    id="clicker-balance"
                >
                    ₿ 0.0000
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Доход / сек
                </div>

                <div
                    class="stat-value"
                    id="clicker-pps"
                >
                    +0.0000
                </div>

            </div>

        </div>


        <div class="coin-ring"></div>


        <div id="clicker-coin">
            ₿
        </div>


        <div class="click-hint">
            Нажимай на биткоин
        </div>


        <div class="actions">

            <button
                class="action-btn primary"
                id="buy-click-power-btn"
            >
                Клик +1
            </button>


            <button
                class="action-btn secondary"
                id="buy-upgrade-btn"
            >
                Купить видеокарту
            </button>

        </div>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<nav class="bottom-nav">

    <a
        href="game.html?v=2"
        class="nav-item"
    >
        <span class="nav-icon">
            🎡
        </span>

        <span class="nav-text">
            Колесо
        </span>
    </a>


    <a
        href="dice.html?v=2"
        class="nav-item"
    >
        <span class="nav-icon">
            🎲
        </span>

        <span class="nav-text">
            Кубики
        </span>
    </a>


    <a
        href="clicker.html?v=2"
        class="nav-item active"
    >
        <span class="nav-icon">
            ⚡
        </span>

        <span class="nav-text">
            Биткоин
        </span>
    </a>


    <a
        href="profile.html?v=2"
        class="nav-item"
    >
        <span class="nav-icon">
            👤
        </span>

        <span class="nav-text">
            Профиль
        </span>
    </a>

</nav>


<script>

    let coins =
        parseInt(
            localStorage.getItem(
                "casino_coins"
            ),
            10
        ) || 100;


    let bitcoin =
        parseFloat(
            localStorage.getItem(
                "crypto_btc"
            )
        ) || 0;


    let clickPower =
        parseInt(
            localStorage.getItem(
                "click_power"
            ),
            10
        ) || 1;


    let btcPerSec =
        parseFloat(
            localStorage.getItem(
                "btc_pps"
            )
        ) || 0;


    const coinsCounter =
        document.getElementById(
            "coins-counter"
        );


    const btcBalance =
        document.getElementById(
            "clicker-balance"
        );


    const btcPpsText =
        document.getElementById(
            "clicker-pps"
        );


    const coin =
        document.getElementById(
            "clicker-coin"
        );


    const clickZone =
        document.getElementById(
            "click-zone"
        );


    const buyClickBtn =
        document.getElementById(
            "buy-click-power-btn"
        );


    const buyGpuBtn =
        document.getElementById(
            "buy-upgrade-btn"
        );


    const toast =
        document.getElementById(
            "toast"
        );


    function updateUI() {

        coinsCounter.textContent =
            `${Math.floor(coins).toLocaleString("ru-RU")} 💰`;


        btcBalance.textContent =
            `₿ ${bitcoin.toFixed(4)}`;


        btcPpsText.textContent =
            `+${btcPerSec.toFixed(4)}`;


        buyClickBtn.textContent =
            `⚡ Клик +1 — ${clickPower * 1000} 💰`;


        buyGpuBtn.textContent =
            `🖥 Купить видеокарту — 50 ₿`;

    }


    updateUI();


    function showToast(text) {

        toast.textContent =
            text;

        toast.classList.add(
            "show"
        );


        clearTimeout(
            showToast.timer
        );


        showToast.timer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "show"
                    );

                },
                1800
            );

    }


    function createFloatingText(
        x,
        y
    ) {

        const floatText =
            document.createElement(
                "div"
            );


        floatText.className =
            "floating-number";


        floatText.textContent =
            `+${clickPower}`;


        const rect =
            clickZone.getBoundingClientRect();


        floatText.style.left =
            `${x - rect.left}px`;


        floatText.style.top =
            `${y - rect.top}px`;


        clickZone.appendChild(
            floatText
        );


        setTimeout(
            () => floatText.remove(),
            650
        );

    }


    coin.addEventListener(
        "pointerdown",
        event => {

            bitcoin += clickPower;


            localStorage.setItem(
                "crypto_btc",
                bitcoin
            );


            createFloatingText(
                event.clientX,
                event.clientY
            );


            updateUI();

        }
    );


    buyClickBtn.addEventListener(
        "click",
        () => {

            const cost =
                clickPower * 1000;


            if (coins >= cost) {

                coins -= cost;

                clickPower++;


                localStorage.setItem(
                    "casino_coins",
                    coins
                );


                localStorage.setItem(
                    "click_power",
                    clickPower
                );


                updateUI();


                showToast(
                    "✅ Сила клика увеличена!"
                );

            }

            else {

                showToast(
                    "❌ Недостаточно монет"
                );

            }

        }
    );


    buyGpuBtn.addEventListener(
        "click",
        () => {

            if (bitcoin >= 50) {

                bitcoin -= 50;

                btcPerSec += 1;


                localStorage.setItem(
                    "crypto_btc",
                    bitcoin
                );


                localStorage.setItem(
                    "btc_pps",
                    btcPerSec
                );


                updateUI();


                showToast(
                    "🖥 Видеокарта куплена!"
                );

            }

            else {

                showToast(
                    "❌ Нужно 50 ₿"
                );

            }

        }
    );


    setInterval(
        () => {

            if (btcPerSec > 0) {

                bitcoin += btcPerSec;


                localStorage.setItem(
                    "crypto_btc",
                    bitcoin
                );


                updateUI();

            }

        },
        1000
    );

</script>

</body>
</html>
