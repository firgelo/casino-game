<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Firgelo Miner — Bitcoin Clicker</title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

</head>


<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                ₿
            </div>

            <div>

                <div class="brand-name">
                    FIRGELO MINER
                </div>

                <div class="brand-subtitle">
                    BITCOIN CLICKER
                </div>

            </div>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            AUTOSAVE ON

        </div>

    </header>


    <main class="main">


        <!-- =========================
             CLICKER
        ========================== -->

        <section class="panel clicker">

            <div class="balance-label">
                YOUR BITCOIN
            </div>


            <div class="balance">

                <span id="balance">
                    0
                </span>

                <span class="unit">
                    BTC
                </span>

            </div>


            <div class="coin-area">

                <div class="coin-glow"></div>

                <button
                    id="coin"
                    class="coin"
                    aria-label="Mine Bitcoin"
                ></button>

            </div>


            <div class="click-hint">
                TAP / CLICK TO MINE
            </div>


            <div class="stats">


                <div class="stat">

                    <div class="stat-label">
                        PER CLICK
                    </div>

                    <div
                        id="dpc"
                        class="stat-value gold"
                    >
                        +1
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        PER SECOND
                    </div>

                    <div
                        id="dps"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        LEVEL
                    </div>

                    <div
                        id="level"
                        class="stat-value"
                    >
                        1
                    </div>

                </div>


            </div>


            <div class="level-box">

                <div class="level-head">

                    <span id="levelText">
                        Level 1
                    </span>

                    <span id="xpText">
                        0 / 100
                    </span>

                </div>


                <div class="progress">

                    <div
                        id="xpBar"
                        class="progress-fill"
                    ></div>

                </div>

            </div>

        </section>


        <!-- =========================
             UPGRADES
        ========================== -->

        <section class="panel upgrades">


            <div class="section-head">

                <div class="section-title">
                    Mining Upgrades
                </div>

                <div class="section-subtitle">
                    Increase your Bitcoin production
                </div>

            </div>


            <div
                id="upgradeList"
                class="upgrade-list"
            ></div>


            <!-- ACHIEVEMENTS -->

            <div class="achievements">

                <div class="section-head">

                    <div class="section-title">
                        Achievements
                    </div>

                    <div class="section-subtitle">
                        Permanent click bonuses
                    </div>

                </div>


                <div
                    id="achievementList"
                    class="achievement-list"
                ></div>

            </div>


        </section>


    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script
    src="js/script.js"
    defer
></script>

</body>

</html>
